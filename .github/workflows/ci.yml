# SPDX-License-Identifier: Apache-2.0
# Purpose: continuous integration gates: formatting, lints, tests, documentation, file headers,
#          version consistency and dependency policy. Third-party actions are pinned by commit SHA.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUSTDOCFLAGS: "-D warnings"

jobs:
  gates:
    name: gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        # `--no-fail-fast` so one failing crate does not hide the rest, and a backtrace so a
        # failure that only happens on one platform can be read rather than guessed at.
        #
        # A failing test is also re-emitted as a workflow error, which GitHub turns into an
        # annotation. Annotations are visible on the run's summary and through the public API,
        # so anyone can see *which* test failed and why without permission to read the raw log.
        env:
          RUST_BACKTRACE: 1
        run: |
          set -o pipefail
          if cargo test --workspace --locked --no-fail-fast 2>&1 | tee test-output.log; then
            exit 0
          fi
          grep -E "^---- .* stdout ----|panicked at|^assertion|left:|right:|^test .*FAILED" \
            test-output.log | head -40 | while IFS= read -r line; do
            printf '::error::%s\n' "$(printf '%s' "$line" | sed 's/%/%25/g')"
          done
          exit 1
      - name: Documentation
        run: cargo doc --workspace --no-deps --locked

  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: SPDX headers and module documentation
        run: sh scripts/check-headers
      - name: Version consistency
        run: sh scripts/bump-version --check
      - name: Dependency policy (licenses, advisories, sources)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
