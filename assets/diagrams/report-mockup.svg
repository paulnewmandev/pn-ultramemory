<text x="420" y="104" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="600" fill="#8f97bd" letter-spacing="0.08em">MEMORIES</text>
<text x="420" y="134" font-family="ui-monospace, SFMono-Regular, monospace" font-size="24" font-weight="700" fill="#ffd166">34</text>
