<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="800" height="540" role="img" aria-label="HTML report mockup showing repository graph summary, symbol table with relevance bars, memory annotations and PageRank indicators">
<title>HTML Report View</title>
<defs>
