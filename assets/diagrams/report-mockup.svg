<stop offset="0%" stop-color="#0f172a"/>
<stop offset="100%" stop-color="#0b1120"/>
</linearGradient>
<linearGradient id="bar-fill" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#7cf4ff"/>
<stop offset="100%" stop-color="#5ee7ff"/>
</linearGradient>
</defs>
<!-- Page background -->
