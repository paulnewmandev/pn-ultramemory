<line x1="32" y1="356" x2="768" y2="356" stroke="#2b3648"/>
<!-- Memory card 1 -->
<rect x="32" y="368" width="360" height="64" rx="8" fill="#ffd166" fill-opacity="0.06" stroke="#ffd166" stroke-opacity="0.28"/>
<text x="48" y="388" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="600" fill="#ffd166">decision</text>
<text x="110" y="388" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" fill="#8f97bd">anchored to Engine::answer</text>
<text x="48" y="406" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#e8ecff">Answer is the only public entry; everything else is</text>
<text x="48" y="422" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#e8ecff">pub(crate) so the API surface stays minimal.</text>
<!-- Memory card 2 (stale) -->
<rect x="408" y="368" width="360" height="64" rx="8" fill="#ff4d6d" fill-opacity="0.06" stroke="#ff4d6d" stroke-opacity="0.35"/>
<text x="424" y="388" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="600" fill="#ff4d6d">⚠ stale (body changed)</text>
<text x="576" y="388" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" fill="#8f97bd">anchored to assemble::sort</text>
<text x="424" y="406" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#e8ecff">Sort by relevance descending; ties broken by utility</text>
<text x="424" y="422" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#e8ecff">so richer detail wins when budget allows.</text>
<!-- Legend / footer -->
<line x1="32" y1="452" x2="768" y2="452" stroke="#2b3648"/>
<circle cx="44" cy="472" r="4" fill="#ffd166"/><text x="56" y="476" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#8f97bd">Memory anchored</text>
<circle cx="180" cy="472" r="4" fill="#ff4d6d"/><text x="192" y="476" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#8f97bd">Stale (reason shown)</text>
<rect x="330" y="466" width="40" height="12" rx="3" fill="url(#bar-fill)"/><text x="378" y="476" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#8f97bd">PageRank score</text>
<text x="32" y="504" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#6b7684">Generated offline by pn-ultramemory. Nothing on this page reaches the network.</text>
<text x="32" y="524" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#6b7684">Structural hubs surface through PageRank even without keyword matches. Staleness says why a memory needs review.</text>
